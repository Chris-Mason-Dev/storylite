name: Publish npm Packages

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          show-progress: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Build packages
        run: pnpm build:packages

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Publish packages
        shell: bash
        run: |
          set -euo pipefail

          published=0
          skipped=0
          mapfile -t package_dirs < <(find packages -mindepth 2 -maxdepth 2 -name package.json -print | sort | xargs -n1 dirname)

          for package_dir in "${package_dirs[@]}"; do
            package_json="$package_dir/package.json"
            name="$(node -p "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')).name" "$package_json")"
            version="$(node -p "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')).version" "$package_json")"
            private_package="$(node -p "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')).private === true ? 'true' : 'false'" "$package_json")"

            if [[ "$private_package" == "true" ]]; then
              echo "Skipping private package $name@$version."
              skipped=$((skipped + 1))
              continue
            fi

            package_version_url="$(node -e "process.stdout.write('https://registry.npmjs.org/' + encodeURIComponent(process.argv[1]) + '/' + encodeURIComponent(process.argv[2]))" "$name" "$version")"
            status="$(curl -sS -o /tmp/npm-package-version.json -w '%{http_code}' "$package_version_url")"

            if [[ "$status" == "200" ]]; then
              echo "Skipping $name@$version because it already exists on npm."
              skipped=$((skipped + 1))
              continue
            fi

            if [[ "$status" != "404" ]]; then
              echo "::error title=npm registry check failed::Expected HTTP 200 or 404 for $name@$version, got $status."
              cat /tmp/npm-package-version.json
              exit 1
            fi

            echo "Publishing $name@$version."
            pnpm --dir "$package_dir" publish --access public --provenance --no-git-checks
            published=$((published + 1))
          done

          {
            echo "### npm publish"
            echo ""
            echo "| Result | Count |"
            echo "| --- | --- |"
            echo "| Published | $published |"
            echo "| Skipped | $skipped |"
          } >> "$GITHUB_STEP_SUMMARY"
