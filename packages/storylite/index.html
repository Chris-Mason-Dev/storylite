<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      ;(() => {
        try {
          const root = document.documentElement
          const theme = localStorage.getItem('storylite:app-theme')
          if (theme === 'light' || theme === 'dark') {
            root.dataset.storyliteAppTheme = theme
            root.style.colorScheme = theme
          } else {
            delete root.dataset.storyliteAppTheme
            root.style.removeProperty('color-scheme')
          }
        } catch {
          document.documentElement.style.removeProperty('color-scheme')
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Lightweight alternative to Storybook for HTML, React, Svelte, Vue, and Solid component stories."
    />
    <!--storylite-manager-head-->
    <!--app-head-->
    <title>StoryLite</title>
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/main.ts"></script>
    <noscript class="noscript__alert">
      <p>
        JavaScript is disabled. In static builds, use the sidebar story links to open materialized
        story pages; controls and iframe previews require JavaScript.
      </p>
    </noscript>
  </body>
</html>
